# Run KoPlay on your own computer and let phones join from anywhere.
# Use ./start.sh: it checks Docker, starts this stack, and opens the display on the
# public tunnel URL. Optional settings (GEMINI_API_KEY, LOCAL_PORT, LOCAL_USER) come
# from your environment or a .env file next to this one.
name: tv-games-local

services:
  app:
    build: .
    ports:
      # Bind to localhost only: the local API needs no password.
      - "127.0.0.1:${LOCAL_PORT:-4747}:3000"
    restart: "no"
    environment:
      LOCAL_MODE: "1"
      LOCAL_USER: "${LOCAL_USER:-Host}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
    volumes:
      - ./server/data:/app/server/data

  # Cloudflare quick tunnel: gives the app a public https://*.trycloudflare.com
  # URL with no account, domain, or router changes. The URL changes every run.
  tunnel:
    image: cloudflare/cloudflared:2025.2.1
    command: tunnel --no-autoupdate --url http://app:3000
    restart: "no"
    depends_on:
      - app
