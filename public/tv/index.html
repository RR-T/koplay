<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KoPlay</title>
  <link rel="stylesheet" href="tv.css">
</head>
<body>
  <div id="screen-intro" class="screen">
    <video id="intro-video" autoplay playsinline>
      <source src="koplay.mp4" type="video/mp4">
    </video>
  </div>

  <div id="screen-waiting" class="screen hidden">
    <img src="icon.png" alt="KoPlay" class="waiting-logo" id="waiting-logo">
    <div id="qr-waiting"></div>
    <p class="subtitle">Scan to join!</p>
  </div>

  <div id="screen-lobby" class="screen hidden">
    <div class="lobby-layout">
      <div class="lobby-main">
        <h1>KoPlay</h1>
        <ul id="lobby-players" class="player-list"></ul>
        <p class="subtitle">Waiting for host to pick a game...</p>
      </div>
      <div class="lobby-qr">
        <div id="qr-lobby"></div>
        <p>Scan to join</p>
      </div>
    </div>
  </div>

  <div id="screen-playing" class="screen hidden">
    <div class="playing-layout">
      <div class="playing-main">
        <h1 id="game-title"></h1>
        <div id="game-display"></div>
      </div>
      <div class="playing-qr">
        <div id="qr-playing"></div>
        <p>Scan to join</p>
      </div>
    </div>
  </div>

  <script src="qrcode.min.js"></script> 
  <script src="/socket.io/socket.io.js"></script>
  <script src="gorillas.js"></script>
  <script src="acrophobia.js"></script> 
  <script src="trivia.js"></script>
  <script src="tv.js"></script>
</body>
</html>
