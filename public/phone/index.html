<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>TV Party Games - Controller</title>
  <link rel="stylesheet" href="phone.css">
</head>
<body>
  <div id="screen-join" class="screen">
    <h1>TV Party Games</h1>
    <form id="join-form">
      <input type="text" id="name-input" placeholder="Your name" maxlength="20" autocomplete="off" required>
      <button type="submit">Join</button>
    </form>
    <p id="join-error" class="error hidden"></p>
  </div>

  <div id="screen-waiting" class="screen hidden">
    <h1>TV Party Games</h1>
    <p class="info">Waiting for the TV to connect...</p>
  </div>

  <div id="screen-lobby-host" class="screen hidden">
    <h1>You're the host!</h1>
    <div id="game-list"></div>
    <h2>Players</h2>
    <ul id="host-players" class="player-list"></ul>
  </div>

  <div id="screen-lobby-player" class="screen hidden">
    <h1>You're in!</h1>
    <p class="info">Waiting for host to pick a game...</p>
    <h2>Players</h2>
    <ul id="player-players" class="player-list"></ul>
  </div>

  <div id="screen-playing" class="screen hidden">
    <h1 id="playing-game-name"></h1>
    <div id="playing-content"></div>
    <h2>Players</h2>
    <ul id="playing-players" class="player-list"></ul>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="gorillas.js"></script>
  <script src="phone.js"></script>
</body>
</html>
