<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KoPlay</title>
    <style>
        * { margin: 0; padding: 0; }
        html, body, iframe { width: 100%; height: 100%; border: none; overflow: hidden; }

        #focus-trap {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            z-index: 1;
            background: transparent;
        }

        #exit-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            z-index: 9999;
            background: rgba(26, 26, 46, 0.92);
            font-family: -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif;
            color: #eee;
        }
        #exit-overlay.visible {
            display: -webkit-flex;
            display: flex;
            -webkit-justify-content: center;
            justify-content: center;
            -webkit-align-items: center;
            align-items: center;
            -webkit-flex-direction: column;
            flex-direction: column;
        }

        #exit-overlay h1 { font-size: 3rem; margin-bottom: 2.5rem; font-weight: 600; }

        .exit-buttons {
            display: -webkit-flex;
            display: flex;
        }

        .exit-btn {
            padding: 1rem 3rem;
            font-size: 1.8rem;
            font-weight: 600;
            border: 3px solid transparent;
            border-radius: 0.75rem;
            cursor: pointer;
            outline: none;
        }
        .exit-btn-gap { margin-left: 2rem; }
        .exit-btn.focused { border-color: #fff; }
        #btn-yes { background: #e94560; color: #fff; }
        #btn-no  { background: #333; color: #eee; }
    </style>
</head>
<body>
    <iframe src="https://koplay.example.com/tv" allow="fullscreen" tabindex="-1"></iframe>
    <div id="focus-trap" tabindex="0"></div>
    <div id="exit-overlay">
        <h1>End game and exit?</h1>
        <div class="exit-buttons">
            <button id="btn-yes" class="exit-btn">Yes</button>
            <button id="btn-no" class="exit-btn exit-btn-gap focused">No</button>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
